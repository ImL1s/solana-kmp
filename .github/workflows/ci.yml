name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: kotlin-solana

      - uses: actions/checkout@v4
        with:
          repository: ImL1s/kotlin-crypto-pure
          path: kotlin-crypto-pure

      - uses: actions/checkout@v4
        with:
          repository: ImL1s/kotlin-blockchain-client
          path: kotlin-blockchain-client

      - uses: actions/checkout@v4
        with:
          repository: ImL1s/kotlin-tx-builder
          path: kotlin-tx-builder

      - uses: actions/checkout@v4
        with:
          repository: ImL1s/kotlin-address
          path: kotlin-address

      - uses: actions/checkout@v4
        with:
          repository: ImL1s/kotlin-utxo
          path: kotlin-utxo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > kotlin-solana/local.properties
          echo "sdk.dir=$ANDROID_HOME" > kotlin-crypto-pure/local.properties
          echo "sdk.dir=$ANDROID_HOME" > kotlin-blockchain-client/local.properties
          echo "sdk.dir=$ANDROID_HOME" > kotlin-tx-builder/local.properties
          echo "sdk.dir=$ANDROID_HOME" > kotlin-address/local.properties
          echo "sdk.dir=$ANDROID_HOME" > kotlin-utxo/local.properties

      - name: Build with Gradle
        working-directory: kotlin-solana
        run: ./gradlew build -PexcludeIntegrationTests=true
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m
